<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Games by Shauna</title>
  <meta name="description" content="Small games to play in your browser, made by Shauna.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='8' fill='%23d3217c'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: #f1ebf7; --surface: #ffffff; --ink: #231a36; --muted: #6a5f80; --line: #dbd1e7;
      --accent: #d3217c; --accent-ink: #ffffff; --string: #7f7398; --denim: #3d629c; --stitch: #e0a04a;
      --display: 'Fredoka', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif;
      --body: 'Figtree', 'Segoe UI', system-ui, sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #130e21; --surface: #1f1733; --ink: #f3edfb; --muted: #a99fbe; --line: #352a50;
        --accent: #ff5fae; --accent-ink: #2b0a1c; --string: #d4cbe6;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
      padding: env(safe-area-inset-top, 0px) max(20px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(20px, env(safe-area-inset-left, 0px));
    }
    main { max-width: 880px; margin: 0 auto; padding-block: 56px 72px; display: flex; flex-direction: column; gap: 40px; }
    h1 { font: 700 clamp(2.4rem, 8vw, 4rem)/1 var(--display); margin: 0 0 12px; letter-spacing: -0.01em; text-wrap: balance; }
    .lede { margin: 0; color: var(--muted); max-width: 46ch; font-size: 1.1rem; }
    .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; list-style: none; margin: 0; padding: 0; }
    .card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; color: inherit; text-decoration: none; transition: transform .15s ease; height: 100%; }
    .card:hover { transform: translateY(-3px); }
    .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .art { height: 170px; display: grid; place-items: center; position: relative; background: var(--denim);
      background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.07) 0 2px, transparent 2px 5px); }
    .art::before { content: ""; position: absolute; left: 0; right: 0; top: 14px; border-top: 3px dashed var(--stitch); }
    .strand { display: flex; align-items: center; gap: 4px; position: relative; padding: 0 16px; }
    .strand::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: #e9e2f6; }
    .strand span { position: relative; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
      font: 700 18px/1 var(--display); color: #1c1830; background: linear-gradient(#ffffff, #e4dfec);
      box-shadow: inset 0 -2px 0 rgba(0,0,0,.14), 0 3px 6px rgba(10,20,60,.45); }
    .strand span.dot { width: 15px; border-radius: 6px; background: linear-gradient(#ff8cc6, #d3217c); }
    .info { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .info h2 { font: 600 1.4rem/1.2 var(--display); margin: 0; }
    .info p { margin: 0; color: var(--muted); }
    .play { margin-top: auto; padding-top: 12px; font-weight: 600; color: var(--accent); }
    .soon { border: 1px dashed var(--line); border-radius: 22px; display: grid; place-items: center; min-height: 200px; color: var(--muted); padding: 20px; text-align: center; }
    footer { color: var(--muted); font-size: .9rem; }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Games by Shauna</h1>
      <p class="lede">Small things to play in your browser. No downloads and no sign-up.</p>
    </header>
    <ul class="games">
      <li>
        <a class="card" href="/13-beads/">
          <div class="art" aria-hidden="true">
            <div class="strand"><span>1</span><span>3</span><span class="dot"></span><span>B</span><span>E</span><span>A</span><span>D</span><span>S</span></div>
          </div>
          <div class="info">
            <h2>13 Beads</h2>
            <p>String a friendship bracelet, spell your phrase, and pin it to your jacket.</p>
            <span class="play">Play 13 Beads</span>
          </div>
        </a>
      </li>
      <li class="soon">More games are on the way.</li>
    </ul>
    <footer>Made by Shauna.</footer>
  </main>
</body>
</html>
