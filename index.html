<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Midnights</title>
  <meta name="description" content="Small games to play in your browser, made by Shauna.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='8' fill='%23d3217c'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Figtree:wght@400;500;600&family=Syne:wght@800&family=Caveat:wght@600;700&family=Press+Start+2P&display=swap">
  <style>
    :root {
      --bg: #f1ebf7; --surface: #ffffff; --ink: #231a36; --muted: #6a5f80; --line: #dbd1e7;
      --accent: #d3217c; --accent-ink: #ffffff;
      --display: 'Fredoka', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif;
      --title: 'Syne', 'Arial Black', system-ui, sans-serif;
      --hand: 'Caveat', 'Bradley Hand', 'Segoe Print', cursive;
      --photo-paper: #fbfaf6; --photo-ink: #2a2433; --photo-muted: #6b6474;
      --body: 'Figtree', 'Segoe UI', system-ui, sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #130e21; --surface: #1f1733; --ink: #f3edfb; --muted: #a99fbe; --line: #352a50;
        --accent: #ff5fae; --accent-ink: #2b0a1c;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
      padding: env(safe-area-inset-top, 0px) max(20px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(20px, env(safe-area-inset-left, 0px));
    }
    main { max-width: 880px; margin: 0 auto; padding-block: 56px 72px; display: flex; flex-direction: column; gap: 40px; }
    h1 { font: 800 clamp(2.6rem, 10vw, 4.6rem)/1 var(--title); margin: 0; letter-spacing: -0.01em; }
    /* Polaroid cards: white frame, deep bottom margin with a handwritten caption, each photo resting at a slight angle. */
    .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 40px 32px; list-style: none; margin: 0; padding: 0; justify-items: center; }
    .games > li { width: 100%; max-width: 300px; }
    .card { display: flex; flex-direction: column; background: var(--photo-paper); color: var(--photo-ink); text-decoration: none; padding: 14px 14px 0; border-radius: 3px; height: 100%;
      box-shadow: 0 1px 2px rgba(30, 20, 40, .18), 0 10px 24px rgba(30, 20, 40, .16); transform: rotate(var(--tilt, -1.5deg)); transition: transform .18s ease, box-shadow .18s ease; }
    .games > li:nth-child(2n) .card { --tilt: 1.8deg; }
    .games > li:nth-child(3n) .card { --tilt: -0.8deg; }
    a.card:hover, a.card:focus-visible { transform: rotate(0deg) translateY(-6px); box-shadow: 0 2px 4px rgba(30, 20, 40, .18), 0 18px 36px rgba(30, 20, 40, .22); }
    .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 6px; }
    .art { aspect-ratio: 1 / 1; display: grid; place-items: center; position: relative; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .06);
      background:
        radial-gradient(60% 80% at 88% 8%, rgba(255, 244, 190, .85), transparent 70%),
        linear-gradient(135deg, #ff9ec7 0%, #f8b9e2 32%, #c8b6f6 62%, #9fd3ff 100%); }
    .art-night { background:
        radial-gradient(1px 1px at 12% 18%, #9a9aa6 99%, transparent), radial-gradient(1px 1px at 27% 62%, #54475e 99%, transparent),
        radial-gradient(1px 1px at 41% 12%, #e8e8e8 99%, transparent), radial-gradient(1px 1px at 63% 26%, #7a6c80 99%, transparent),
        radial-gradient(1px 1px at 78% 9%, #9a9aa6 99%, transparent), radial-gradient(1px 1px at 88% 48%, #54475e 99%, transparent),
        radial-gradient(1px 1px at 8% 82%, #7a6c80 99%, transparent), radial-gradient(1px 1px at 93% 80%, #9a9aa6 99%, transparent),
        radial-gradient(40% 55% at 50% 118%, rgba(255, 196, 110, .22), transparent 70%),
        #000; }
    .night-title { font: 400 18px/1.6 'Press Start 2P', ui-monospace, Menlo, monospace; color: #e6493a; text-align: center; letter-spacing: .04em;
      text-shadow: 3px 3px 0 #3a0c09; margin: 0; }
    .night-title span { display: block; }
    .strand { display: flex; align-items: center; gap: 6px; }
    .strand span { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center;
      font: 700 28px/1 var(--display); color: #1c1830; background: #ffffff;
      box-shadow: 0 6px 14px rgba(120, 60, 140, .28); }
    .caption { padding: 12px 6px 20px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .caption h2 { font: 700 1.9rem/1.1 var(--hand); margin: 0; }
    .caption p { margin: 0; font: 600 1.15rem/1.25 var(--hand); color: var(--photo-muted); }
    .soon .card { --tilt: 2.4deg; }
    .art-blank { background: linear-gradient(160deg, #4a4340, #2c2725 70%); }
    footer { color: var(--muted); font-size: .9rem; }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Midnights</h1>
    </header>
    <ul class="games">
      <li>
        <a class="card" href="/13-beads/">
          <div class="art" aria-hidden="true">
            <div class="strand"><span>1</span><span>3</span></div>
          </div>
          <div class="caption">
            <h2>13 Beads</h2>
            <p>String a friendship bracelet, spell your phrase, and pin it to your jacket.</p>
          </div>
        </a>
      </li>
      <li>
        <a class="card" href="/homebeforedark/">
          <div class="art art-night" aria-hidden="true">
            <p class="night-title"><span>HOME</span><span>BEFORE DARK</span></p>
          </div>
          <div class="caption">
            <h2>Home Before Dark</h2>
            <p>Ride home at night. When the streetlights flicker, something is coming. Swerve.</p>
          </div>
        </a>
      </li>
      <li class="soon">
        <div class="card" aria-label="More games coming soon">
          <div class="art art-blank" aria-hidden="true"></div>
          <div class="caption">
            <h2>Coming soon</h2>
            <p>Still developing.</p>
          </div>
        </div>
      </li>
    </ul>
    <footer>Made by Shauna.</footer>
  </main>
</body>
</html>
